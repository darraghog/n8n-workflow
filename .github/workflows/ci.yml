name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate workflows
        run: python3 scripts/generate-main-workflow.py
      - name: Workflow harness
        run: node tests/workflow-harness.mjs
      - name: Workflow JSON syntax
        run: |
          for f in workflows/*.json; do
            python3 -m json.tool "$f" >/dev/null
          done
      - name: Secret scan
        run: bash scripts/secret-scan.sh
